<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Startup Opportunity Aggregator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="mb-3">Startup Opportunity Aggregator</h1>
  <form class="row g-2 mb-3">
    <div class="col-md-4"><input class="form-control" name="q" placeholder="Search" value="{{ q }}"></div>
    <div class="col-md-3"><input class="form-control" name="source" placeholder="Source" value="{{ source }}"></div>
    <div class="col-md-3"><input class="form-control" name="type" placeholder="Type" value="{{ kind }}"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div>
  </form>
  <div class="table-responsive">
    <table class="table table-striped table-bordered bg-white">
      <thead><tr><th>Title</th><th>Type</th><th>Organizer</th><th>Source</th><th>Link</th></tr></thead>
      <tbody>
      {% for item in items %}
      <tr>
        <td>{{ item.title }}</td><td>{{ item.opportunity_type }}</td><td>{{ item.organizer }}</td><td>{{ item.source_platform }}</td>
        <td><a href="{{ item.source_link }}" target="_blank">Open</a></td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-center text-muted">No opportunities found.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
